<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000000"><title>上传照片 / Memory</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="phone-shell"><header>MEMORY / RECONSTRUCTION</header><h1>把照片带入这段回忆</h1><input type="file" id="file" accept=".jpg,.jpeg,.png,.webp,.tif,.tiff,.dng,.heic,.heif" hidden><button class="upload-area" id="pick"><span id="hint">选择照片</span><img id="preview" alt="所选照片" hidden></button><p id="status" role="status">选择一张与你的回忆有关的照片，发送到电脑。</p><button class="primary-action" id="send" disabled>发送到电脑 ↗</button><p>照片用于当前电脑上的回忆重构。<br>请保持电脑页面打开。</p></main><script type="module" src="/static/phone.js"></script></body></html>
