<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="594mm" viewBox="0 0 420 594">
  <title>Version 3</title>
  <desc>The figure is an hourglass-shaped structure made of disconnected individual lines. The lines gradually increase in length and then decrease again, with each line rotating 5 degrees to the right. Two sets of parallel thin lines converge toward the center from above and below, forming a narrow, interwoven structure in the middle, and then expand outward in opposite directions. The visual structure consists of two groups of straight lines arranged into two opposing fan shapes. The lines in the upper section extend upward and gradually spread apart, forming an open fan shape. The overall outline resembles an elongated hourglass, a twisted ribbon, or two sets of parallel lines interweaving with each other. Version 3: the middle is a twist (rope/cloth from one face to the other), not a point. The two fans do not join at a vertex.
seed=5 lineCount=38 stepAngle=2.5 longestFraction=0.4 shortestRatio=0.41 waistWidth=42 startAngle=1</desc>
