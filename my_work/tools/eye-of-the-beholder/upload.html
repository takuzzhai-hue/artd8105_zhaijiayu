<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>把一张照片送到屏幕</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #0c0c0c; color: #d8d4cc; }
    body {
      font: 16px/1.45 -apple-system, "PingFang SC", sans-serif;
      min-height: 100vh;
    }
    label.full {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 100vh;
      padding: 32px 24px;
      box-sizing: border-box;
    }
    h1 { font-size: 1.35rem; font-weight: 600; margin: 0 0 12px; }
    p { color: #8a8680; margin: 0 0 12px; }
    #status { color: #e8e4d8; min-height: 1.4em; }
    input[type="file"] {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
    }
    label.full { position: relative; }
  </style>
</head>
<body>
  <label class="full">
    <h1>把一张照片送到屏幕</h1>
    <p>点屏幕任意处，选择或拍摄一张照片。</p>
    <p id="status"></p>
    <input id="file" type="file" accept="image/*">
  </label>
  <script>
    const topic = (location.hash.replace(/^#/, "") || new URLSearchParams(location.search).get("topic") || "").trim();
    const fileInput = document.getElementById("file");
    const status = document.getElementById("status");
    function setStatus(msg) { status.textContent = msg; }

    if (!topic) setStatus("缺少屏幕编号。请重新扫描屏幕上的二维码。");

    fileInput.addEventListener("change", () => {
      const file = fileInput.files && fileInput.files[0];
      if (file) send(file);
    });

    async function toJpeg(file) {
      const bmp = await createImageBitmap(file);
      const maxEdge = 1600;
      const scale = Math.min(1, maxEdge / Math.max(bmp.width, bmp.height));
      const w = Math.max(1, Math.round(bmp.width * scale));
      const h = Math.max(1, Math.round(bmp.height * scale));
      const canvas = document.createElement("canvas");
      canvas.width = w;
      canvas.height = h;
      canvas.getContext("2d").drawImage(bmp, 0, 0, w, h);
      if (bmp.close) bmp.close();
      return new Promise((resolve, reject) => {
        canvas.toBlob((blob) => blob ? resolve(blob) : reject(new Error("encode")), "image/jpeg", 0.86);
      });
    }

    async function send(file) {
      if (!topic) return;
      setStatus("正在送出…");
      try {
        const blob = await toJpeg(file);
        const res = await fetch("https://ntfy.sh/" + encodeURIComponent(topic), {
          method: "PUT",
          headers: { Filename: "photo.jpg", "Content-Type": "image/jpeg", Title: "eotb" },
          body: blob,
        });
        if (!res.ok) throw new Error("http " + res.status);
        setStatus("已送到屏幕。再点一次可以换一张。");
      } catch (err) {
        setStatus("没有送出。请确认手机能上网。");
      }
      fileInput.value = "";
    }
  </script>
</body>
</html>
